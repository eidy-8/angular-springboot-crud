<div class="example-container">
    <mat-card class="example-card" appearance="outlined">
        <mat-card-header>
            <mat-card-title>Login</mat-card-title>
        </mat-card-header>

        <br>

        <form class="form" [formGroup]="loginForm" (ngSubmit)="login()">
            <mat-form-field>
                <mat-label>Digite seu email</mat-label>
                <input
                matInput
                placeholder="usuario@exemplo.com"
                [formControl]="email"
                (blur)="updateEmailErrorMessage()"
                required
                />
                @if (email.invalid) {
                <mat-error>{{emailErrorMessage()}}</mat-error>
                }
            </mat-form-field>
    
            <mat-form-field>
                <mat-label>Digite sua senha</mat-label>
                <input
                matInput
                [formControl]="password"
                (blur)="updatePasswordErrorMessage()"
                required
                />
                @if (password.invalid) {
                <mat-error>{{passwordErrorMessage()}}</mat-error>
                }
            </mat-form-field>

            @if (loginError) {
                <p>Erro ao realizar o login.</p>
            }
    
            <button type="submit" matButton="filled">Entrar</button>
        </form>

    </mat-card>
</div>
